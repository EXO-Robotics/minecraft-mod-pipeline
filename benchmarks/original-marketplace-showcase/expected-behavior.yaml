schema_version: 1.0.0
status: UNVERIFIED
quality_thresholds:
  gameplay_fidelity_percent: 90
  interaction_fidelity_percent: 90
  required_persistence_percent: 100
  tested_multiplayer_isolation_percent: 100
  critical_omissions: 0
  silent_failures: 0
  crash_causing_script_errors: 0
  unbounded_tick_loops: 0
expectations:
  - id: progression
    behavior: "Each player earns and retains independent progression across leave, restart, and upgrade."
    required_tests: [gameplay, persistence, multiplayer, migration]
  - id: machine
    behavior: "A placed processing machine accepts input, advances bounded work, emits output, and resumes after restart."
    required_tests: [event_adapter, gameplay, persistence, performance]
  - id: boss
    behavior: "A custom boss enters observable phases at deterministic thresholds without cross-entity state leakage."
    required_tests: [gameplay, multiplayer, performance]
  - id: controller_form
    behavior: "All choices are reachable, labeled, cancelable, and safe with a controller."
    required_tests: [controller, gameplay, multiplayer]
  - id: approved_redesign
    behavior: "The report identifies original intent, replacement interaction, preserved behavior, losses, and approval."
    required_tests: [decision_record, gameplay, controller]
  - id: unsupported
    behavior: "The mechanic is omitted from consumer output and remains explicit in reports with evidence and reason."
    required_tests: [static, report]

