[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-compiler-baseline"
version = "0.1.0"
description = "Evidence-backed Java-to-Bedrock mod reconstruction baseline"
requires-python = ">=3.11"

[project.scripts]
mccompiler = "mccompiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

